function local(){return new Promise(r=>{if(!navigator.geolocation)return r({erro:'aparelho sem GPS'});
navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lon:p.coords.longitude,prec:Math.round(p.coords.accuracy)}),e=>r({erro:e.code==1?'localização recusada':'localização indisponível'}),{enableHighAccuracy:true,timeout:20000,maximumAge:60000})})}
function registra(quem,g){if(!L.url)return;try{fetch(L.url,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({chave:L.chave,tipo:'acesso',pessoa:quem,pagina:document.title,
lat:g.lat!=null?g.lat.toFixed(6):g.erro,lon:g.lon!=null?g.lon.toFixed(6):'',precisao:g.prec||'',aparelho:navigator.userAgent})})}catch(e){}}
async function tenta(sen,auto){const r=await abrir(sen);const E=document.getElementById('e');if(r===null){if(!auto)E.textContent='Senha incorreta.';return}
L=r.L;if(LIVRE.indexOf(r.quem)>=0){registra(r.quem,{erro:'acesso livre (sem pedir localização)'});try{sessionStorage.setItem('bs_senha',sen)}catch(e){}document.open();document.write(r.h.split('__BS_QUEM__').join(r.quem||''));document.close();return}
E.style.color='#1F2A24';E.textContent='Confirmando sua localização…';const g=await local();registra(r.quem,g);
if(g.erro){E.style.color='#C00000';E.innerHTML='Não foi possível abrir: '+g.erro+'. Ative a localização do celular e permita o acesso para este site, depois toque em Abrir de novo.';return}
try{sessionStorage.setItem('bs_senha',sen)}catch(e){}document.open();document.write(r.h.split('__BS_QUEM__').join(r.quem||''));document.close()}
