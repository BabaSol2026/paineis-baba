async function abrir(sen){const te=new TextEncoder();const base=await crypto.subtle.importKey('raw',te.encode(sen),'PBKDF2',false,['deriveKey']);
for(const [i,k] of D.ks.entries()){try{const kk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(k.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);

const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},ck,u(D.ct));return {h:new TextDecoder().decode(pt),quem:D.ps[i]}}catch(e){}}return null}
function local(){return new Promise(r=>{if(!navigator.geolocation)return r({erro:'aparelho sem GPS'});

async function tenta(sen,auto){const r=await abrir(sen);const E=document.getElementById('e');if(r===null){if(!auto)E.textContent='Senha incorreta.';return}
E.style.color='#1F2A24';E.textContent='Confirmando sua localização…';const g=await local();registra(r.quem,g);
if(g.erro){E.style.color='#C00000';E.innerHTML='Não foi possível abrir: '+g.erro+'. Ative a localização do celular e permita o acesso para este site, depois toque em Abrir de novo.';return}
